# Запуск на своём сервере: docker compose up -d --build
# Настройки — в файле .env (см. .env.example).
services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:24-slim}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      - ./data:/data
    # Для своего nginx вместо Caddy: приложение доступно на 127.0.0.1:${APP_PORT}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  # HTTPS-сертификат получает сам (Let's Encrypt). Выключить: COMPOSE_PROFILES= в .env
  caddy:
    image: ${CADDY_IMAGE:-public.ecr.aws/docker/library/caddy:2}
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
